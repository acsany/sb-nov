[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "secondbrain"
version = "0.0.1"
description = "A Python application."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["click>=8.1,<9", "loguru"]

[project.scripts]
secondbrain = "secondbrain.cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-env>=1.8",
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = ["tests"]

[tool.pytest_env]
env_files = [".env.test"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
